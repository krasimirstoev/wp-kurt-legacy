name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          plugin_version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*$/\1/p' wp-kurt-legacy.php | head -n 1)"
          stable_tag="$(sed -nE 's/^Stable tag:[[:space:]]*([^[:space:]]+).*$/\1/p' readme.txt | head -n 1)"
          if [[ "$plugin_version" != "$RELEASE_VERSION" || "$stable_tag" != "$RELEASE_VERSION" ]]; then
            echo "::error::Git tag ($RELEASE_VERSION), plugin Version ($plugin_version), and readme Stable tag ($stable_tag) must match."
            exit 1
          fi

      - name: Deploy plugin to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: krasimirstoev
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: kurt-vonnegut-http-header
